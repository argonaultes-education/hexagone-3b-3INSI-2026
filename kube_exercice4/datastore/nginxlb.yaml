apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginxlb-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginxlb
      tiers: web
  template:
    metadata:
      name: nginxlb
      labels:
        app: nginxlb
        tiers: web
    spec:
      containers:
        - name: nginxlb
          image: argonaulteshexagone/nginxlb:latest
          ports:
            - containerPort: 90
---
apiVersion: v1
kind: Service
metadata:
  name: nginxlb
spec:
  type: NodePort
  selector:
    app: nginxlb
    tiers: web
  ports:
    - protocol: TCP
      port: 90
