apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-deployment
spec:
  selector:
    matchLabels:
      app: erp
      tiers: bdd
  template:
    metadata:
      name: erp
      labels:
        app: erp
        tiers: bdd
    spec:
      containers:
        - name: erp
          image: postgres:latest
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: db-names
                  key: ERP_DB
                  optional: true
            - name: POSTGRES_PASSWORD
              value: password
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: erp
spec:
  selector:
    app: erp
    tiers: bdd
  ports:
    - protocol: TCP
      port: 5432
