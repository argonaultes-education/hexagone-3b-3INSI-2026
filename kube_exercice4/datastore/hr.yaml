apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-deployment
spec:
  selector:
    matchLabels:
      app: hr
      tiers: bdd
  template:
    metadata:
      name: hr
      labels:
        app: hr
        tiers: bdd
    spec:
      containers:
        - name: hr
          image: mysql:latest
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: db-names
                  key: HR_DB
                  optional: true
            - name: MYSQL_ROOT_PASSWORD
              value: password
          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: hr
spec:
  selector:
    app: hr
    tiers: bdd
  ports:
    - protocol: TCP
      port: 3306
