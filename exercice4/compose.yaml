services:
  erp:
    image: postgres:17
    environment:
      - POSTGRES_DB=erp
      - POSTGRES_PASSWORD=password
    volumes:
      - ./scripts/user.sql:/docker-entrypoint-initdb.d/

  crm:
    image: postgres:latest
    environment:
      - POSTGRES_DB=crm
      - POSTGRES_PASSWORD=password

  hr:
    image: mysql:latest
    environment:
      - MYSQL_DATABASE=hr
      - MYSQL_ROOT_PASSWORD=password

  admin:
    image: adminer:latest
    depends_on:
      - hr
      - crm
      - erp

  lb:
    image: lb-nginx
    build:
      dockerfile: Dockerfile
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '8006:90'
    depends_on:
      - admin

